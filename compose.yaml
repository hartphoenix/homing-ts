name: homing-ts

services:
  db:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to a pinned PostgreSQL image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6

  provision:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to a pinned PostgreSQL image}
    restart: "no"
    init: true
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?set DATABASE_ADMIN_URL}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?set POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?set POSTGRES_MIGRATION_USER}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?set POSTGRES_MIGRATION_PASSWORD}
    volumes:
      - ./docker/provision-db.sh:/usr/local/bin/homing-provision-db:ro
    networks: [database]
    depends_on:
      db:
        condition: service_healthy
    command: ["/usr/local/bin/homing-provision-db"]

  migrate:
    image: ${HOMING_IMAGE:?set HOMING_IMAGE to the immutable release image}
    restart: "no"
    init: true
    environment:
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?set DATABASE_MIGRATION_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      AUTH_THROTTLE_KEY: ${AUTH_THROTTLE_KEY:?set AUTH_THROTTLE_KEY}
      NODE_ENV: production
      HOMING_DEMO_ACCOUNTS: "0"
    networks: [database]
    depends_on:
      db:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    command: ["bun", "run", "db:migrate"]

  harden:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to a pinned PostgreSQL image}
    restart: "no"
    init: true
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?set DATABASE_ADMIN_URL}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?set POSTGRES_APP_USER}
    volumes:
      - ./docker/harden-runtime-role.sh:/usr/local/bin/homing-harden-runtime-role:ro
    networks: [database]
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["/usr/local/bin/homing-harden-runtime-role"]

  web:
    image: ${HOMING_IMAGE:?set HOMING_IMAGE to the immutable release image}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      AUTH_THROTTLE_KEY: ${AUTH_THROTTLE_KEY:?set AUTH_THROTTLE_KEY}
      NODE_ENV: production
      HOMING_DEMO_ACCOUNTS: "0"
      PORT: 8000
    expose: ["8000"]
    networks: [edge, database]
    depends_on:
      harden:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 4

  caddy:
    image: ${CADDY_IMAGE:?set CADDY_IMAGE to a pinned Caddy image}
    restart: unless-stopped
    init: true
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    command:
      - /bin/sh
      - -ec
      - |
        case "$${APP_DOMAIN}" in
          http://localhost|http://127.0.0.1) ;;
          ""|*[!A-Za-z0-9.-]*)
            echo "APP_DOMAIN must be a bare hostname (localhost HTTP is allowed only for rehearsal)" >&2
            exit 1
            ;;
        esac
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "${HOMING_HTTP_PUBLISH:-80}:80"
      - "${HOMING_HTTPS_PUBLISH:-443}:443"
      - "${HOMING_HTTPS_UDP_PUBLISH:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  database:
    internal: true
