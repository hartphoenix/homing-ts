name: homing-ts

services:
  db:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build: .
    image: homing-ts-web:local
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      AUTH_THROTTLE_KEY: ${AUTH_THROTTLE_KEY:?set AUTH_THROTTLE_KEY}
      NODE_ENV: production
      PORT: 8000
    expose: ["8000"]
    networks: [edge, database]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 4

  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    init: true
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports:
      - "${HOMING_HTTP_PUBLISH:-80}:80"
      - "${HOMING_HTTPS_PUBLISH:-443}:443"
      - "${HOMING_HTTPS_UDP_PUBLISH:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-homing-ts-postgres}
  caddy_data:
    name: ${CADDY_DATA_VOLUME_NAME:-homing-ts-caddy-data}
  caddy_config:
    name: ${CADDY_CONFIG_VOLUME_NAME:-homing-ts-caddy-config}

networks:
  edge:
    name: ${EDGE_NETWORK_NAME:-homing-ts-edge}
  database:
    name: ${DATABASE_NETWORK_NAME:-homing-ts-database}
    internal: true
